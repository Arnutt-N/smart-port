name: CI

# ⚠️ Auto-trigger ปิดชั่วคราว (GitHub Actions quota ฟรีหมด) — 2026-06-19
# Verify แทนด้วย local (ไม่กิน Actions minutes):
#   1) .\scripts\ci-local.ps1          / bash scripts/ci-local.sh
#   2) .\scripts\ci-act.ps1            / bash scripts/ci-act.sh   (nektos/act + Docker; ใช้ .actrc)
#   3) pre-push light gate: .\scripts\install-git-hooks.ps1  แล้ว git push จะรัน frontend vitest
# เปิดกลับ: คืน push/pull_request block ด้านล่าง (ดู git log ของไฟล์นี้) แล้วลบ workflow_dispatch

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths-ignore: ['**.md', 'docs/**', 'project-log-md/**', '.claude/**']
  # pull_request:
  #   branches: [main]
  #   paths-ignore: ['**.md', 'docs/**', 'project-log-md/**', '.claude/**']

# ยกเลิก run เก่าเมื่อ push ทับ branch/PR เดิม (ประหยัด Actions minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  e2e-menus:
    name: E2E All Menus
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Create non-production test environment
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=rootpassword
          MYSQL_DATABASE=civil_service_mgmt
          MYSQL_USER=root
          MYSQL_PASSWORD=rootpassword
          JWT_SECRET=ci-only-not-for-production
          EOF

      - name: Start database and backend
        run: docker compose up -d --build db backend

      - name: Wait for schema and backend
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T db sh -c \
                'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot --silent -e "SELECT 1 FROM personnel LIMIT 1" "$MYSQL_DATABASE"' \
                >/dev/null 2>&1 \
              && curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              echo "schema and backend ready"; exit 0
            fi
            sleep 5
          done
          echo "schema/backend startup timed out"
          docker compose logs db backend
          exit 1

      - name: Run all-menu E2E gate
        working-directory: frontend
        run: npm run test:e2e:menus

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-menu-failure-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop test stack
        if: always()
        run: |
          docker compose down -v
          rm -f .env

  schema-parity:
    name: Schema Parity Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # กัน database/tidb-init.sql (bootstrap ของ production) drift จาก migration
      # และกัน migration ใหม่ที่ลืม mount ใน docker-compose / ไฟล์นี้
      - name: Validate schema parity
        run: node scripts/validate-schema-parity.mjs
      # regression ของสคริปต์ใน scripts/ — mock server บน 127.0.0.1 ทั้งหมด ไม่ออกเน็ต
      # (gate ที่บังคับจริงทุกครั้งคือ .githooks/pre-push เพราะ workflow นี้ปิด auto-trigger อยู่)
      - name: Script regressions (offline mock servers)
        run: node --test scripts/tests/*.test.mjs

  backend-tests:
    name: Backend PHPUnit (Unit + Integration)
    runs-on: ubuntu-latest
    # หมายเหตุ: ใช้ docker run แทน services: เพราะ GH Actions สตาร์ท service containers
    # ก่อน checkout — mount init SQL จาก repo ไม่ได้; job นี้เพิ่ม ~3-4 นาที/run ตอนเปิด auto-trigger
    steps:
      - uses: actions/checkout@v4

      - name: Start MySQL with schema init (mirror docker-compose.yaml)
        run: |
          docker run -d --name ci-mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=rootpassword \
            -e MYSQL_DATABASE=civil_service_mgmt \
            -v "$PWD/mysql_database_design.sql:/docker-entrypoint-initdb.d/01-schema.sql" \
            -v "$PWD/photo_management_system.sql:/docker-entrypoint-initdb.d/02-data.sql" \
            -v "$PWD/database/03-personnel-stubs.sql:/docker-entrypoint-initdb.d/03-personnel-stubs.sql" \
            -v "$PWD/database/04-career-path.sql:/docker-entrypoint-initdb.d/04-career-path.sql" \
            -v "$PWD/database/05-probation.sql:/docker-entrypoint-initdb.d/05-probation.sql" \
            -v "$PWD/database/06-seed-data.sql:/docker-entrypoint-initdb.d/06-seed-data.sql" \
            -v "$PWD/database/07-add-education-level.sql:/docker-entrypoint-initdb.d/07-add-education-level.sql" \
            -v "$PWD/database/08-career-path-v11.sql:/docker-entrypoint-initdb.d/08-career-path-v11.sql" \
            -v "$PWD/database/09-auth-users.sql:/docker-entrypoint-initdb.d/09-auth-users.sql" \
            -v "$PWD/database/10-import-log.sql:/docker-entrypoint-initdb.d/10-import-log.sql" \
            -v "$PWD/database/11-import-constraints.sql:/docker-entrypoint-initdb.d/11-import-constraints.sql" \
            -v "$PWD/database/12-import-log-fk.sql:/docker-entrypoint-initdb.d/12-import-log-fk.sql" \
            -v "$PWD/database/13-multiplier-time-counting.sql:/docker-entrypoint-initdb.d/13-multiplier-time-counting.sql" \
            -v "$PWD/database/14-multiplier-area-admin.sql:/docker-entrypoint-initdb.d/14-multiplier-area-admin.sql" \
            -v "$PWD/database/15-api-rate-limit-hits.sql:/docker-entrypoint-initdb.d/15-api-rate-limit-hits.sql" \
            -v "$PWD/database/21-audit-log.sql:/docker-entrypoint-initdb.d/21-audit-log.sql" \
            -v "$PWD/database/17-probation-dashboard-view.sql:/docker-entrypoint-initdb.d/17-probation-dashboard-view.sql" \
            -v "$PWD/database/18-refresh-tokens.sql:/docker-entrypoint-initdb.d/18-refresh-tokens.sql" \
            -v "$PWD/database/19-awards.sql:/docker-entrypoint-initdb.d/19-awards.sql" \
            -v "$PWD/database/20-royal-decorations.sql:/docker-entrypoint-initdb.d/20-royal-decorations.sql" \
            -v "$PWD/database/22-unify-person-identity.sql:/docker-entrypoint-initdb.d/22-unify-person-identity.sql" \
            -v "$PWD/database/23-external-ref.sql:/docker-entrypoint-initdb.d/23-external-ref.sql" \
            -v "$PWD/database/24-drop-dead-tables.sql:/docker-entrypoint-initdb.d/24-drop-dead-tables.sql" \
            -v "$PWD/database/25-ensure-multiplier-tables.sql:/docker-entrypoint-initdb.d/25-ensure-multiplier-tables.sql" \
            -v "$PWD/database/27-superadmin-permission-overrides.sql:/docker-entrypoint-initdb.d/27-superadmin-permission-overrides.sql" \
            -v "$PWD/database/28-prefix-in-probation-view.sql:/docker-entrypoint-initdb.d/28-prefix-in-probation-view.sql" \
            -v "$PWD/database/29-ensure-probation-view-prefixes.sql:/docker-entrypoint-initdb.d/29-ensure-probation-view-prefixes.sql" \
            -v "$PWD/database/30-photo-blob-storage.sql:/docker-entrypoint-initdb.d/30-photo-blob-storage.sql" \
            mysql:8.0

      - name: Wait for schema init to finish
        run: |
          # -h 127.0.0.1 สำคัญ: ระหว่าง init mysql:8.0 รัน temporary server แบบ
          # socket-only (--skip-networking) — probe ผ่าน socket จะผ่านก่อน init จบ
          # แล้ว step migrations จะชน TCP refused (Issue #129)
          for i in $(seq 1 60); do
            if docker exec ci-mysql mysql -h 127.0.0.1 -uroot -prootpassword --silent \
              -e "SELECT 1 FROM personnel LIMIT 1" civil_service_mgmt >/dev/null 2>&1; then
              echo "schema ready"; exit 0
            fi
            sleep 5
          done
          echo "schema init timed out"; docker logs ci-mysql; exit 1

      - name: Build PHPUnit test image
        run: docker build -t smartport-phpunit:ci -f backend/tests/Dockerfile.test backend/tests

      # Issue #129: init mounts ไม่ได้สร้าง schema_migrations → ต้องรัน migration runner
      # ก่อน suite (baseline 03–30 ข้าม test-seed) ไม่งั้น readyz pending===0 ว่างเปล่า
      # retry 3 ครั้งกัน race ชั่วคราว (TCP ยังไม่เปิด/init ยังไม่จบ) — error จริงจะพังครบทั้ง 3
      - name: Run migrations against CI MySQL
        run: |
          for i in 1 2 3; do
            docker run --rm --network host \
              -e MYSQL_HOST=127.0.0.1 \
              -e MYSQL_DATABASE=civil_service_mgmt \
              -e MYSQL_USER=root \
              -e MYSQL_PASSWORD=rootpassword \
              -v "$PWD/backend:/app" -v "$PWD/database:/database" -w /app smartport-phpunit:ci \
              php scripts/run-migrations.php && exit 0
            echo "migration attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "migrations failed after 3 attempts"; exit 1

      - name: Run PHPUnit (unit + integration)
        run: |
          docker run --rm --network host \
            -e MYSQL_HOST=127.0.0.1 \
            -e MYSQL_DATABASE=civil_service_mgmt \
            -e MYSQL_USER=root \
            -e MYSQL_PASSWORD=rootpassword \
            -v "$PWD/backend:/app" -v "$PWD/database:/database" -w /app smartport-phpunit:ci \
            sh -c 'composer install --no-interaction --no-progress --ignore-platform-req=ext-gd 2>/dev/null \
              || composer update --no-interaction --no-progress --ignore-platform-req=ext-gd; \
              php vendor/bin/phpunit'

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: smartport-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: smartport-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
