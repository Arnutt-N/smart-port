name: Deploy to Render

# ⚠️ Auto-deploy ปิดชั่วคราว (GitHub Actions quota ฟรีหมด) — 2026-06-19
# Deploy แทน (ไม่กิน Actions minutes):
#   A) แนะนำ: Render Dashboard → service → Settings → Build & Deploy → Auto-Deploy = Yes (branch main)
#   B) Manual:  .\scripts\deploy-render.ps1   หรือ  bash scripts/deploy-render.sh
#      (ตั้ง RENDER_DEPLOY_HOOK_URL ใน env หรือ .env — script ไม่พิมพ์ URL)
#   C) Dashboard → Manual Deploy
# เปิดกลับ GH workflow: คืน push block ด้านล่าง แล้วลบ workflow_dispatch
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths-ignore: ['**.md', 'docs/**', 'project-log-md/**', '.claude/**']

jobs:
  deploy:
    name: Trigger Render Deploy
    # N57: deploy หลัง CI jobs ทั้งชุดผ่าน — ไม่ trigger บน build แดง
    # (หมายเหตุ: ทำงานเฉพาะเมื่อ CI รันเองด้วย — ปัจจุบัน CI เป็น workflow_dispatch อย่างเดียว
    #  ตาม N30; เปิด CI อัตโนมัติเมื่อ quota พร้อม)
    needs: [frontend-build, schema-parity, tidb-init-bootstrap, backend-tests, docker-build]
    runs-on: ubuntu-latest
    # นำ secret มาเป็น env ระดับ job — ห้ามอ้าง secrets ใน if: โดยตรง (parse ไม่ผ่าน)
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Deploy to Render
        # env ใช้ใน if: ได้ — ถ้าไม่ตั้ง secret ก็ข้าม step นี้แทนที่จะ fail
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_URL" \
            --fail --silent --show-error
