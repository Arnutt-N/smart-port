<!DOCTYPE html>
<html lang="th">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ระบบขัดข้องชั่วคราว | Smart Port</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: 'Noto Sans Thai', system-ui, -apple-system, sans-serif;
    background: #f8fafc;
    color: #0f172a;
  }
  main { max-width: 30rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
  p { margin: 0 0 1.5rem; line-height: 1.7; color: #475569; }
  a {
    display: inline-block;
    padding: 0.625rem 1.25rem;
    border-radius: 0.5rem;
    background: #0284c7;
    color: #fff;
    text-decoration: none;
    font-weight: 500;
  }
  a:hover { background: #0369a1; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f172a; color: #e2e8f0; }
    p { color: #94a3b8; }
  }
</style>
<main>
  <h1>ระบบขัดข้องชั่วคราว</h1>
  <p>
    ขออภัย ขณะนี้ไม่สามารถให้บริการได้ชั่วคราว
    กรุณาลองใหม่อีกครั้งในอีกสักครู่ หากยังพบปัญหา กรุณาติดต่อผู้ดูแลระบบ
  </p>
  <a href="/">กลับหน้าแรก</a>
</main>
</html>
