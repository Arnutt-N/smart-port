server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/html text/css text/plain application/javascript application/json application/xml image/svg+xml;

    # Security headers (ชุดเดียวกับ render.yaml — ดู docs/frontend-security-headers.md)
    # Docker path นี้ enforce CSP เลย (render.yaml เริ่ม report-only เพื่อ inventory ก่อน)
    # แหล่งเดียวอยู่ที่ nginx-security-headers.conf (copy ไป /etc/nginx/snippets/ ใน Dockerfile)
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # FIX: แก้ไขค่าของ gzip_proxied ให้ถูกต้องตามไวยากรณ์
    gzip_proxied expired no-cache no-store private;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Handle client-side routing
    # no-store — กัน Cloudflare/CDN (s-maxage) เสิร์ฟ index.html เก่าที่ชี้ chunk hash หาย
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets caching — include snippet เพราะ add_header ใน location นี้
    # ทำให้ server-level headers ไม่ inherit ลงมา (Issue #126)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Prevent access to hidden files
    location ~ /\. {
        deny all;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
