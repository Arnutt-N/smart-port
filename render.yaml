services:
  - type: web
    name: smart-port
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    envVars:
      - key: VITE_API_URL
        value: /api
    # Issue #113: Render static site ไม่ได้ใช้ frontend/nginx.conf — ต้องประกาศ headers ที่นี่
    # นโยบายเต็ม + cache decision อยู่ใน docs/frontend-security-headers.md
    # CSP เริ่มแบบ report-only เพื่อ inventory ก่อน enforce (report ไปที่ backend /api/csp-report)
    headers:
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), geolocation=(), microphone=(), payment=()"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # app shell: revalidate ทุกครั้ง — กัน stale shell ที่ชี้ hashed chunk หาย (เหตุผลเดียวกับ nginx.conf)
      - path: /*
        name: Cache-Control
        value: no-cache
      # Vite hashed assets — cache ถาวรได้ปลอดภัย
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /api/*
        destination: https://smartport-backend.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: smartport-backend
    runtime: docker
    branch: main
    # Build จาก repo root เพื่อให้ database/ (ไฟล์ migration) ติดไปกับ image และ
    # docker-entrypoint.sh รัน run-migrations.php ได้เอง — ตัว Dockerfile ที่ root มี
    # production hardening ครบเท่ากับ backend/Dockerfile ทุกข้อ ต่างแค่ COPY database/
    # และตั้ง RUN_MIGRATIONS=1
    #
    # ⚠️ ต้องเคลียร์ "Root Directory" ในหน้า Render dashboard ของ service นี้ให้ว่าง
    #    ถ้า dashboard ยังตั้งเป็น backend อยู่ ค่าจะทับ blueprint แล้ว build จะกลับไปใช้
    #    backend/Dockerfile (ยังทำงานได้ แต่ไม่มี migration = schema ต้อง apply มือ)
    #    วิธีเช็คว่าใช้ตัวไหน: GET / ของ backend จะคืน migrations_available
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    buildFilter:
      paths:
        - backend/**
        - database/**
        - render.yaml
        - Dockerfile
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_DATABASE
        value: civil_service_mgmt
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL
        value: "true"
      # TiDB Serverless chain จบที่ public root CA ซึ่งอยู่ใน /etc/ssl/certs/ca-certificates.crt
      # ของ image php:8.3-apache อยู่แล้ว — config.php fail-closed ถ้า MYSQL_SSL=true แต่ไม่มี CA (issue #114)
      - key: MYSQL_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: JWT_SECRET
        generateValue: true
