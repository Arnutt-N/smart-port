services:
  - type: web
    name: smart-port
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    # ค่าจริงตั้งไว้บน Render service แล้ว (dashboard) — sync: false = sync ข้าม ไม่แตะค่าเดิม
    envVars:
      - key: VITE_API_URL
        sync: false
    # Issue #113: Render static site ไม่ได้ใช้ frontend/nginx.conf — ต้องประกาศ headers ที่นี่
    # นโยบายเต็ม + cache decision อยู่ใน docs/frontend-security-headers.md
    # CSP เริ่มแบบ report-only เพื่อ inventory ก่อน enforce (report ไปที่ backend /api/csp-report)
    headers:
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), geolocation=(), microphone=(), payment=()"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Cache-Control กฎเดียวทั้ง site: no-cache — browser revalidate ทุกครั้ง (ETag ทำให้ได้ 304)
      # อดีตเคยแยกกฎ immutable ให้ assets แต่วัดจริง 2026-08-17: engine ของ Render จัดกฎ
      # Cache-Control สองตัวที่ path ทับกันแบบไม่ deterministic (ค่าแกว่ง ~90/10 ต่อ request
      # แม้สลับลำดับกฎ) — เลือกกฎเดียวที่ deterministic เพราะความเสี่ยง stale shell แพงกว่า
      # ผลได้จาก asset caching — ทางกลับมาใช้ immutable: docs/frontend-security-headers.md
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /api/*
        destination: https://smartport-backend.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: smartport-backend
    runtime: docker
    branch: main
    # plan/region จาก dashboard export 2026-08-17 — ต้องระบุ ไม่งั้น sync ใช้ค่า default ที่ไม่ตรงของจริง
    region: singapore
    plan: free
    # Build จาก repo root เพื่อให้ database/ (ไฟล์ migration) ติดไปกับ image และ
    # docker-entrypoint.sh รัน run-migrations.php ได้เอง — ตัว Dockerfile ที่ root มี
    # production hardening ครบเท่ากับ backend/Dockerfile ทุกข้อ ต่างแค่ COPY database/
    # และตั้ง RUN_MIGRATIONS=1
    #
    # (ยืนยันกับ dashboard export 2026-08-17: service จริงใช้ Dockerfile root และ
    # ไม่ได้ตั้ง Root Directory ทับ — เช็คซ้ำได้ด้วย GET / ของ backend ที่คืน migrations_available)
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - database/**
        - render.yaml
        - Dockerfile
    # env ทั้ง 8 ตัว (ค่า TiDB + JWT_SECRET) มีค่าจริงอยู่บน Render service แล้ว —
    # sync: false ทุกตัวเพื่อ adoption แบบไม่ขยับค่าเดิม (รวม JWT_SECRET ไม่โดน regenerate)
    # ค่าที่ไม่ใช่ความลับที่ควรมีบน service (จดกันหาย): MYSQL_SSL=true,
    # MYSQL_SSL_CA=/etc/ssl/certs/ca-certificates.crt (CA สาธารณะใน image ใช้ยืนยัน TiDB),
    # MYSQL_PORT=4000, MYSQL_DATABASE=civil_service_mgmt — เหตุผลเต็ม docs/render-tidb-production.md
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL
        sync: false
      - key: MYSQL_SSL_CA
        sync: false
      - key: JWT_SECRET
        sync: false
      # Issue #113 (R1): shared secret ของ GET /api/csp-report/summary
      # ไม่ได้ตั้ง = endpoint ตอบ 503 (fail-closed) ส่วนการนับ violation ยังทำงานปกติ
      # ต้องยาว >= 32 ตัวอักษร ไม่งั้นถูกปฏิเสธเป็น 503 เหมือนกัน (backend/routes/csp_summary.php)
      - key: CSP_SUMMARY_TOKEN
        sync: false
